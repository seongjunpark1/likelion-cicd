name: bluegreen

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    restart: unless-stopped

  blue:
    image: ${IMAGE}
    container_name: blue
    environment:
      - APP_COLOR=blue
      - JAVA_OPTS=-Xmx256m
    restart: unless-stopped

  green:
    image: ${IMAGE}
    container_name: green
    environment:
      - APP_COLOR=green
      - JAVA_OPTS=-Xmx256m
    restart: unless-stopped